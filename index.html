<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalle del Producto - Little Caesars</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="phone-mockup">
    
    <!-- Barra superior de estado -->
    <div class="status-bar">
      <span class="time">09:52 AM</span>
      <div class="status-icons">
        <svg class="icon" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L4.35 19.35a.75.75 0 001.06 1.06l1.74-1.74C8.68 19.5 10.28 20 12 20c4.97 0 9-4.03 9-9s-4.03-9-9-9zm0 15c-3.31 0-6-2.69-6-6s2.69-6 6-6 6 2.69 6 6-2.69 6-6 6z"/></svg>
        <svg class="icon" viewBox="0 0 24 24" fill="currentColor"><path d="M12 4C7.31 4 3.07 5.9 0 8.98L12 21 24 8.98C20.93 5.9 16.69 4 12 4z"/></svg>
        <svg class="icon" viewBox="0 0 24 24" fill="currentColor"><path d="M17 4h-3V2h-4v2H7c-.55 0-1 .45-1 1v16c0 .55.45 1 1 1h10c.55 0 1-.45 1-1V5c0-.55-.45-1-1-1z"/></svg>
      </div>
    </div>

    <!-- Imagen del Producto Principal -->
    <div class="product-hero">
      <button class="close-btn" onclick="history.back()">✕</button>
      <img src="https://images.unsplash.com/photo-1541745537411-b8046dc6d66c?q=80&w=500&auto=format&fit=crop" alt="Crazy Puff + Coca Cola">
    </div>

    <!-- Detalle e Información -->
    <div class="product-details">
      <div class="rating-badge-row">
        <div class="rating-item">
          <span class="star">★</span>
          <span class="rating-num">4.8</span>
          <span class="rating-count">(24)</span>
        </div>
        <div class="trophy-item">
          <span>🏆 Buen Sabor</span>
        </div>
      </div>

      <h1 class="product-title">1 Crazzy Puff + 1 Coca Cola</h1>
      <p class="product-desc">1 porción de Crazzy Puffs de pepperoni + 1 bebida de Coca Cola de 600ml</p>

      <div class="price-row">
        <span class="current-price">Q39</span>
        <span class="old-price">Q41</span>
      </div>

      <span class="discount-tag">5% DTO</span>

      <!-- Acordeones / Desplegables -->
      <div class="accordion-section">
        
        <div class="accordion-item" id="acc-pizza">
          <div class="accordion-header" onclick="toggleAccordion('acc-pizza')">
            <div>
              <div class="accordion-title">Pizza adicional</div>
              <div class="accordion-sub">Elige hasta 3 opciones</div>
            </div>
            <span class="arrow">∨</span>
          </div>
          <div class="accordion-content">
            <label><input type="checkbox"> Pizza Pepperoni (+Q45)</label>
            <label><input type="checkbox"> Pizza Queso (+Q45)</label>
            <label><input type="checkbox"> Pizza Hawaiana (+Q55)</label>
          </div>
        </div>

        <div class="accordion-item" id="acc-complemento">
          <div class="accordion-header" onclick="toggleAccordion('acc-complemento')">
            <div>
              <div class="accordion-title">Complemento adicional</div>
              <div class="accordion-sub">Elige hasta 2 opciones</div>
            </div>
            <span class="arrow">∨</span>
          </div>
          <div class="accordion-content">
            <label><input type="checkbox"> Crazy Bread (+Q20)</label>
            <label><input type="checkbox"> Salsa de ajo adicional (+Q5)</label>
          </div>
        </div>

      </div>
    </div>

    <!-- Barra Inferior de Compra Funcional -->
    <div class="bottom-bar">
      <div class="summary-info">
        <span id="qty-summary">1 producto</span>
        <span id="total-price" class="total-price">Q39</span>
      </div>
      <div class="actions-row">
        <div class="quantity-picker">
          <button id="btn-minus" onclick="changeQuantity(-1)">-</button>
          <span id="qty-count">1</span>
          <button id="btn-plus" onclick="changeQuantity(1)">+</button>
        </div>
        <button class="btn-agregar" onclick="agregarAlCarrito()">Agregar</button>
      </div>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
